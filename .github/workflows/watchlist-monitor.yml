name: Daily Watchlist Monitor

on:
  schedule:
    # Run at 9:15 PM UTC (4:15 PM ET) on business days
    # Adjust the hour/minute to run after your market close
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
      
      - name: Run watchlist monitor
        run: python watchlist_monitor.py

        name: watchlist

on:
  schedule:
    - cron: '0 22 * * 1-5'  # example: run at 22:00 UTC Mon-Fri
  workflow_dispatch:

jobs:
  run-watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watchlist monitor
        run: |
          python watchlist_monitor.py

      - name: Upload triggers artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-triggers
          path: triggers
      
      - name: Commit trigger logs and prompts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trigger_log.jsonl triggers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Watchlist triggers: $(date +%Y-%m-%d)" && git push)
        continue-on-error: true
