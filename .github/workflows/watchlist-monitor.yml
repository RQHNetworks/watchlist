name: Daily Watchlist Monitor

on:
  schedule:
    # Target: 4:30 PM ET, business days only (markets are closed weekends).
    # GitHub Actions cron is fixed UTC and can't express "4:30 PM ET" directly
    # because ET shifts between EDT (UTC-4) and EST (UTC-5) with daylight saving.
    # We schedule both possible UTC times and let the "Verify run time" step
    # below skip whichever one doesn't currently correspond to 4:30 PM ET.
    # Note: cron day-of-week is in UTC, so 20:30/21:30 UTC Mon-Fri already
    # lands on the correct ET business day (it's still the same ET day, just
    # a few hours earlier than midnight UTC).
    - cron: '30 20 * * 1-5'  # 4:30 PM EDT (UTC-4), roughly mid-Mar to early-Nov
    - cron: '30 21 * * 1-5'  # 4:30 PM EST (UTC-5), roughly early-Nov to mid-Mar
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify run time (skip the non-matching DST cron trigger)
        id: check_time
        run: |
          current_et_time=$(TZ="America/New_York" date +%H:%M)
          echo "Current ET time: $current_et_time"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$current_et_time" = "16:30" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this is the scheduled trigger for the other DST offset."
          fi

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run watchlist monitor
        if: steps.check_time.outputs.should_run == 'true'
        run: python watchlist_monitor.py

      - name: Upload triggers artifact
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-triggers-${{ github.run_number }}
          path: |
            triggers
            trigger_log.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trigger logs and prompts
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trigger_log.jsonl triggers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Watchlist triggers: $(date +%Y-%m-%d)" && git push)
        continue-on-error: true

      - name: Determine which tickers actually triggered
        if: steps.check_time.outputs.should_run == 'true'
        id: dispatch
        run: |
          files=$(ls triggers/ 2>/dev/null | grep -v '^no_triggers_' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Triggered files: $files"

      - name: Build flag email summary
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        id: flagmail
        run: |
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          # Match against the exact files that fired THIS run (from the
          # previous step), not against today's wall-clock date - a
          # trigger's logged .date is the latest trading day in its price
          # history, which can lag behind the day the workflow actually
          # runs (e.g. over a weekend, or if a feed hasn't updated yet).
          mapfile -t files < <(echo '${{ steps.dispatch.outputs.files }}' | jq -r '.[]')

          tickers_list=()
          lines=""
          for f in "${files[@]}"; do
            base="${f%.txt}"
            if [[ "$base" =~ ^([A-Za-z0-9.]+)_(sma_cross|price_swing|earnings_countdown)_([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              t="${BASH_REMATCH[1]}"; ty="${BASH_REMATCH[2]}"; d="${BASH_REMATCH[3]}"
              detail=$(jq -r --arg t "$t" --arg ty "$ty" --arg d "$d" \
                'select(.ticker == $t and .trigger_type == $ty and .date == $d) | .detail' \
                trigger_log.jsonl | tail -1)
              tickers_list+=("$t")
              lines+="${base} -- ${t} (${ty}): ${detail}"$'\n'
            fi
          done

          tickers=$(printf '%s\n' "${tickers_list[@]}" | sort -u | paste -sd, -)
          echo "tickers=$tickers" >> "$GITHUB_OUTPUT"

          {
            echo 'body<<BODY_EOF'
            echo "Want a full AI-built dashboard for one of these? Reply to this email with its ID line (e.g. quote it back)."
            echo ""
            printf '%s' "$lines"
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Email trigger flags
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Watchlist Monitor <${{ secrets.SMTP_USERNAME }}>
          to: RQHNetworks@outlook.com
          subject: "[${{ steps.flagmail.outputs.date }}] Watchlist Triggers: ${{ steps.flagmail.outputs.tickers }}"
          body: ${{ steps.flagmail.outputs.body }}
