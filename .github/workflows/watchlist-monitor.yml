name: Daily Watchlist Monitor

on:
  schedule:
    # Target: 4:30 PM ET, every day.
    # GitHub Actions cron is fixed UTC and can't express "4:30 PM ET" directly
    # because ET shifts between EDT (UTC-4) and EST (UTC-5) with daylight saving.
    # We schedule both possible UTC times and let the "Verify run time" step
    # below skip whichever one doesn't currently correspond to 4:30 PM ET.
    - cron: '30 20 * * *'  # 4:30 PM EDT (UTC-4), roughly mid-Mar to early-Nov
    - cron: '30 21 * * *'  # 4:30 PM EST (UTC-5), roughly early-Nov to mid-Mar
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      triggered_files: ${{ steps.dispatch.outputs.files }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify run time (skip the non-matching DST cron trigger)
        id: check_time
        run: |
          current_et_time=$(TZ="America/New_York" date +%H:%M)
          echo "Current ET time: $current_et_time"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$current_et_time" = "16:30" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this is the scheduled trigger for the other DST offset."
          fi

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run watchlist monitor
        if: steps.check_time.outputs.should_run == 'true'
        run: python watchlist_monitor.py

      - name: Upload triggers artifact
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-triggers-${{ github.run_number }}
          path: |
            triggers
            trigger_log.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trigger logs and prompts
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trigger_log.jsonl triggers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Watchlist triggers: $(date +%Y-%m-%d)" && git push)
        continue-on-error: true

      - name: Determine which tickers actually triggered
        if: steps.check_time.outputs.should_run == 'true'
        id: dispatch
        run: |
          files=$(ls triggers/ 2>/dev/null | grep -v '^no_triggers_' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Triggered files: $files"

  analyze:
    needs: monitor
    if: needs.monitor.outputs.triggered_files != '' && needs.monitor.outputs.triggered_files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trigger_file: ${{ fromJson(needs.monitor.outputs.triggered_files) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python (for chart rendering)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chart/data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance matplotlib requests beautifulsoup4

      - name: Build prompt for Claude
        id: prompt
        run: |
          base="${TRIGGER_FILE%.txt}"
          {
            echo 'text<<PROMPT_EOF'
            cat "triggers/${TRIGGER_FILE}"
            echo ""
            echo "Save the finished PNG dashboard to dashboards/${base}.png"
            echo "and the written analysis to dashboards/${base}.md in this"
            echo "repository, then commit and push both directly to the main branch."
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          TRIGGER_FILE: ${{ matrix.trigger_file }}

      - name: Run Claude Code on this trigger
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Read,Write,Bash,WebFetch,WebSearch"'
