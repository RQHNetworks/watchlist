name: Daily Watchlist Monitor

on:
  schedule:
    # Target: 4:30 PM ET, business days only (markets are closed weekends).
    # GitHub Actions cron is fixed UTC and can't express "4:30 PM ET" directly
    # because ET shifts between EDT (UTC-4) and EST (UTC-5) with daylight saving.
    # We schedule both possible UTC times and let the "Verify run time" step
    # below skip whichever one doesn't currently correspond to 4:30 PM ET.
    # Note: cron day-of-week is in UTC, so 20:30/21:30 UTC Mon-Fri already
    # lands on the correct ET business day (it's still the same ET day, just
    # a few hours earlier than midnight UTC).
    - cron: '30 20 * * 1-5'  # 4:30 PM EDT (UTC-4), roughly mid-Mar to early-Nov
    - cron: '30 21 * * 1-5'  # 4:30 PM EST (UTC-5), roughly early-Nov to mid-Mar
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify run time (skip the non-matching DST cron trigger)
        id: check_time
        run: |
          # Don't compare wall-clock time to an exact "16:30" - GitHub Actions
          # routinely queues scheduled runs several to 10+ minutes late, which
          # made this guard fail closed (skipping real monitoring runs) far
          # more often than it should. Instead, use github.event.schedule -
          # the literal cron string GitHub says triggered this run - and
          # compare that to the current DST offset, which doesn't drift with
          # scheduling delay the way wall-clock minutes do.
          current_et_offset=$(TZ="America/New_York" date +%z)
          schedule="${{ github.event.schedule }}"
          echo "Current ET UTC offset: $current_et_offset | Triggering schedule: $schedule"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run=true
          elif [ "$schedule" = "30 20 * * 1-5" ] && [ "$current_et_offset" = "-0400" ]; then
            should_run=true   # EDT cron, and we're currently in EDT
          elif [ "$schedule" = "30 21 * * 1-5" ] && [ "$current_et_offset" = "-0500" ]; then
            should_run=true   # EST cron, and we're currently in EST
          else
            should_run=false
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "false" ]; then
            echo "Skipping: this is the scheduled trigger for the other DST offset."
          fi

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run watchlist monitor
        if: steps.check_time.outputs.should_run == 'true'
        run: python watchlist_monitor.py

      - name: Upload triggers artifact
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-triggers-${{ github.run_number }}
          path: |
            triggers
            trigger_log.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trigger logs and prompts
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trigger_log.jsonl triggers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Watchlist triggers: $(date +%Y-%m-%d)" && git push)
        continue-on-error: true

      - name: Determine which tickers actually triggered
        if: steps.check_time.outputs.should_run == 'true'
        id: dispatch
        run: |
          files=$(ls triggers/ 2>/dev/null | grep -v '^no_triggers_' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Triggered files: $files"

      - name: Build flag email summary
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        id: flagmail
        run: |
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          # Match against the exact files that fired THIS run (from the
          # previous step), not against today's wall-clock date - a
          # trigger's logged .date is the latest trading day in its price
          # history, which can lag behind the day the workflow actually
          # runs (e.g. over a weekend, or if a feed hasn't updated yet).
          mapfile -t files < <(echo '${{ steps.dispatch.outputs.files }}' | jq -r '.[]')

          # Grouped by trigger type so the email stays readable as the
          # watchlist grows: earnings countdown (closest date first), then
          # SMA cross (golden crosses before death crosses), then price
          # swings (up moves before down moves).
          tickers_list=()
          earnings_lines=()
          golden_lines=()
          death_lines=()
          up_lines=()
          down_lines=()

          for f in "${files[@]}"; do
            base="${f%.txt}"
            if [[ "$base" =~ ^([A-Za-z0-9.]+)_(sma_cross|price_swing|earnings_countdown)_([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              t="${BASH_REMATCH[1]}"; ty="${BASH_REMATCH[2]}"; d="${BASH_REMATCH[3]}"
              detail=$(jq -r --arg t "$t" --arg ty "$ty" --arg d "$d" \
                'select(.ticker == $t and .trigger_type == $ty and .date == $d) | .detail' \
                trigger_log.jsonl | tail -1)
              tickers_list+=("$t")
              line="${base} -- ${t} (${ty}): ${detail}"

              case "$ty" in
                earnings_countdown)
                  days=$(echo "$detail" | grep -oE '[0-9]+ business day' | grep -oE '[0-9]+' || echo 999)
                  earnings_lines+=("$(printf '%03d' "$days")|$line")
                  ;;
                sma_cross)
                  if [[ "$detail" == golden* ]]; then
                    golden_lines+=("$line")
                  else
                    death_lines+=("$line")
                  fi
                  ;;
                price_swing)
                  if [[ "$detail" == *"move up"* ]]; then
                    up_lines+=("$line")
                  else
                    down_lines+=("$line")
                  fi
                  ;;
              esac
            fi
          done

          tickers=$(printf '%s\n' "${tickers_list[@]}" | sort -u | paste -sd, -)
          echo "tickers=$tickers" >> "$GITHUB_OUTPUT"

          sorted_earnings=()
          if [ "${#earnings_lines[@]}" -gt 0 ]; then
            mapfile -t sorted_earnings < <(printf '%s\n' "${earnings_lines[@]}" | sort -t'|' -k1,1n | cut -d'|' -f2-)
          fi

          {
            echo 'body<<BODY_EOF'
            echo "Want a full AI-built dashboard for one of these? Reply to this email with its ID line (e.g. quote it back)."
            echo ""
            if [ "${#sorted_earnings[@]}" -gt 0 ]; then
              echo "=== Earnings Countdown (closest first) ==="
              printf '%s\n' "${sorted_earnings[@]}"
              echo ""
            fi
            if [ "${#golden_lines[@]}" -gt 0 ] || [ "${#death_lines[@]}" -gt 0 ]; then
              echo "=== SMA Cross (golden, then death) ==="
              [ "${#golden_lines[@]}" -gt 0 ] && printf '%s\n' "${golden_lines[@]}"
              [ "${#death_lines[@]}" -gt 0 ] && printf '%s\n' "${death_lines[@]}"
              echo ""
            fi
            if [ "${#up_lines[@]}" -gt 0 ] || [ "${#down_lines[@]}" -gt 0 ]; then
              echo "=== Price Swings > 10% (up, then down) ==="
              [ "${#up_lines[@]}" -gt 0 ] && printf '%s\n' "${up_lines[@]}"
              [ "${#down_lines[@]}" -gt 0 ] && printf '%s\n' "${down_lines[@]}"
            fi
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Email trigger flags
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Watchlist Monitor <${{ secrets.SMTP_USERNAME }}>
          to: RQHNetworks@outlook.com
          subject: "[${{ steps.flagmail.outputs.date }}] Watchlist Triggers: ${{ steps.flagmail.outputs.tickers }}"
          body: ${{ steps.flagmail.outputs.body }}
