name: Daily Watchlist Monitor

on:
  schedule:
    # Target: 4:30 PM ET, business days only (markets are closed weekends).
    # GitHub Actions cron is fixed UTC and can't express "4:30 PM ET" directly
    # because ET shifts between EDT (UTC-4) and EST (UTC-5) with daylight saving.
    # We schedule both possible UTC times and let the "Verify run time" step
    # below skip whichever one doesn't currently correspond to 4:30 PM ET.
    # Note: cron day-of-week is in UTC, so 20:30/21:30 UTC Mon-Fri already
    # lands on the correct ET business day (it's still the same ET day, just
    # a few hours earlier than midnight UTC).
    - cron: '30 20 * * 1-5'  # 4:30 PM EDT (UTC-4), roughly mid-Mar to early-Nov
    - cron: '30 21 * * 1-5'  # 4:30 PM EST (UTC-5), roughly early-Nov to mid-Mar
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify run time (skip the non-matching DST cron trigger)
        id: check_time
        run: |
          # Don't compare wall-clock time to an exact "16:30" - GitHub Actions
          # routinely queues scheduled runs several to 10+ minutes late, which
          # made this guard fail closed (skipping real monitoring runs) far
          # more often than it should. Instead, use github.event.schedule -
          # the literal cron string GitHub says triggered this run - and
          # compare that to the current DST offset, which doesn't drift with
          # scheduling delay the way wall-clock minutes do.
          current_et_offset=$(TZ="America/New_York" date +%z)
          schedule="${{ github.event.schedule }}"
          echo "Current ET UTC offset: $current_et_offset | Triggering schedule: $schedule"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run=true
          elif [ "$schedule" = "30 20 * * 1-5" ] && [ "$current_et_offset" = "-0400" ]; then
            should_run=true   # EDT cron, and we're currently in EDT
          elif [ "$schedule" = "30 21 * * 1-5" ] && [ "$current_et_offset" = "-0500" ]; then
            should_run=true   # EST cron, and we're currently in EST
          else
            should_run=false
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "false" ]; then
            echo "Skipping: this is the scheduled trigger for the other DST offset."
          fi

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run watchlist monitor
        if: steps.check_time.outputs.should_run == 'true'
        run: python watchlist_monitor.py

      - name: Upload triggers artifact
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-triggers-${{ github.run_number }}
          path: |
            triggers
            trigger_log.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trigger logs and prompts
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trigger_log.jsonl triggers/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Watchlist triggers: $(date +%Y-%m-%d)" && git push)
        continue-on-error: true

      - name: Determine which tickers actually triggered
        if: steps.check_time.outputs.should_run == 'true'
        id: dispatch
        run: |
          files=$(ls triggers/ 2>/dev/null | grep -v '^no_triggers_' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Triggered files: $files"

      - name: Build flag email summary
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        id: flagmail
        run: |
          # The report needs green for a gain and red for a loss, which plain
          # text cannot carry, so the body is generated as HTML by a script
          # rather than assembled here. It also handles the ordering rules and
          # the table layout, which were awkward to express in bash.
          #
          # This step reaches the network: it fetches 15 months of history for
          # each ticker that fired, to fill the 3/6/12-month return columns.
          # Only fired tickers, so typically under a dozen against the 536 the
          # monitor scanned. A fetch failure degrades that ticker's returns to
          # n/a rather than failing the step - the rest of the row comes from
          # the already-committed trigger log and is still correct.
          summary=$(python3 emails/flag_email.py --out flag_email.html)
          echo "Flag email summary: $summary"
          echo "date=$(echo "$summary" | jq -r .date)" >> "$GITHUB_OUTPUT"
          echo "tickers=$(echo "$summary" | jq -r .tickers)" >> "$GITHUB_OUTPUT"

      - name: Email trigger flags
        if: steps.check_time.outputs.should_run == 'true' && steps.dispatch.outputs.files != '[]'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Watchlist Monitor <${{ secrets.SMTP_USERNAME }}>
          to: RQHNetworks@outlook.com
          subject: "[${{ steps.flagmail.outputs.date }}] Watchlist Triggers: ${{ steps.flagmail.outputs.tickers }}"
          # file:// keeps the markup out of a step output - the report is a few
          # KB of HTML and outputs are neither meant for nor reliable at that
          # size, while the action reads the file directly.
          html_body: file://flag_email.html
