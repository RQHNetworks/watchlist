name: SMA Cross Panels

# Runs after the daily monitor finishes and builds the 50/200-day technicals
# panel for every ticker that fired an sma_cross trigger. Deterministic - plain
# matplotlib, no Claude and no API cost - and it sends its own email so the
# existing flag email is untouched.

on:
  workflow_run:
    workflows: ["Daily Watchlist Monitor"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Both DST crons fire on the monitor every weekday. The one that does not
  # match the current offset is skipped by the monitor's own guard, but a
  # skipped run still reports "completed" and "success" - so reacting to
  # completion alone re-sent this email a second time every day, rebuilding
  # panels from triggers that were already committed by the real run.
  #
  # A skipped monitor run never reaches its upload step, so the presence of a
  # triggers artifact is what separates a real run from a skipped one.
  check:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.upstream.outputs.ran }}
    steps:
      - name: Did the monitor actually run?
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "Manual dispatch - proceeding."
            echo "ran=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="${{ github.event.workflow_run.id }}"
          count=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            --jq '[.artifacts[]? | select(.name | startswith("watchlist-triggers-"))] | length')
          echo "Upstream run ${run_id} produced ${count} triggers artifact(s)."

          if [ "$count" -eq 0 ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Monitor skipped this firing (the other DST offset). Nothing to do."
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

  panels:
    needs: check
    if: needs.check.outputs.ran == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance matplotlib

      - name: Build a panel per sma_cross ticker
        id: panels
        run: |
          mkdir -p panels

          mapfile -t files < <(ls triggers/ 2>/dev/null | grep '_sma_cross_' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No sma_cross triggers this run."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tickers=()
          attachments=()
          lines=""

          for f in "${files[@]}"; do
            base="${f%.txt}"
            if [[ "$base" =~ ^([A-Za-z0-9.]+)_sma_cross_([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              t="${BASH_REMATCH[1]}"; d="${BASH_REMATCH[2]}"
              out="panels/${t}_sma_${d}.png"

              # One bad ticker must not lose the rest of the batch.
              company=$(jq -r --arg t "$t" --arg d "$d" \
                'select(.ticker == $t and .trigger_type == "sma_cross" and .date == $d) | .company // ""' \
                trigger_log.jsonl | tail -1)

              # --as-of pins the chart to the trigger's own date, so its numbers
              # match the email body instead of drifting to whenever this ran.
              # --company keeps the chart's name identical to the email's.
              panel_args=(--ticker "$t" --out "$out" --as-of "$d")
              [ -n "$company" ] && panel_args+=(--company "$company")

              if python3 charts/sma_panel.py "${panel_args[@]}"; then
                tickers+=("$t")
                attachments+=("$out")
                detail=$(jq -r --arg t "$t" --arg d "$d" \
                  'select(.ticker == $t and .trigger_type == "sma_cross" and .date == $d) | .detail' \
                  trigger_log.jsonl | tail -1)
                if [ -n "$company" ] && [ "$company" != "$t" ]; then
                  lines+="${t} (${company}): ${detail}"$'\n'
                else
                  lines+="${t}: ${detail}"$'\n'
                fi
              else
                echo "::warning::Panel build failed for ${t}; continuing."
                lines+="${t}: panel build FAILED - see workflow logs"$'\n'
              fi
            fi
          done

          echo "count=${#attachments[@]}" >> "$GITHUB_OUTPUT"
          [ "${#attachments[@]}" -eq 0 ] && exit 0

          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "tickers=$(printf '%s\n' "${tickers[@]}" | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "attachments=$(printf '%s\n' "${attachments[@]}" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<BODY_EOF'
            echo "50/200-day SMA crossover panels are attached."
            echo ""
            printf '%s' "$lines"
            echo ""
            echo "Each chart marks the exact crossover date. The SMAs are computed"
            echo "from the same daily closes the monitor uses, so the chart always"
            echo "agrees with the trigger that fired."
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload panels artifact
        if: steps.panels.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sma-panels-${{ github.run_number }}
          path: panels
          retention-days: 90

      - name: Email SMA panels
        if: steps.panels.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Watchlist Monitor <${{ secrets.SMTP_USERNAME }}>
          to: RQHNetworks@outlook.com
          subject: "[${{ steps.panels.outputs.date }}] SMA Cross Panels: ${{ steps.panels.outputs.tickers }}"
          body: ${{ steps.panels.outputs.body }}
          attachments: ${{ steps.panels.outputs.attachments }}
